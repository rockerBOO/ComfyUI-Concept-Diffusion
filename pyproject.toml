[project]
name = "comfyui-concept-diffusion"
description = "ConceptAttention: Diffusion Transformers Learn Highly Interpretable Features for ComfyUI"
version = "1.0.0"
license = { file = "LICENSE" }
dependencies = ["torch", "numpy", "Pillow", "matplotlib"]

[project.urls]
Repository = "https://github.com/Junst/ComfyUI-Concept-Diffusion"

[tool.comfy]
PublisherId = "concept-diffusion"
DisplayName = "ComfyUI-Concept-Diffusion"
Icon = ""

[tool.pyright]
include = ["."]
exclude = ["__pycache__", ".git"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
extraPaths = ["../.."]

